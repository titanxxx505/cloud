<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Alex Cloud : les fichiers partagés par Alex, à télécharger simplement."><title>Alex Cloud</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#17213c;font:16px/1.6 system-ui,sans-serif}header,main,footer{max-width:1080px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{color:#6054e8}.badge{font-size:12px;background:#e8e5ff;color:#5046b7;padding:5px 12px;border-radius:30px}section.hero{padding:55px 0 40px;max-width:720px}.eyebrow{color:#6054e8;text-transform:uppercase;font-size:12px;letter-spacing:2px;font-weight:750}h1{font-size:clamp(38px,6vw,64px);line-height:1.12;letter-spacing:-2px;margin:18px 0}p{color:#667089}.hero p{font-size:18px;max-width:550px}.panel{background:white;border:1px solid #e1e5f1;border-radius:22px;padding:28px;box-shadow:0 12px 45px #20305a06}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h2{font-size:21px;margin:0}input{font:inherit;border:1px solid #d5dbea;background:#f8f9fc;border-radius:10px;padding:11px 14px;width:280px;max-width:100%}input:focus{outline:2px solid #6054e8;outline-offset:2px}.file{display:flex;align-items:center;gap:16px;padding:22px 0;border-top:1px solid #edf0f6}.icon{width:48px;height:48px;flex-shrink:0;display:grid;place-items:center;background:#efedff;border-radius:12px;font-size:11px;font-weight:800;color:#6054e8}.info{min-width:0;flex:1}.name{font-weight:650;overflow-wrap:anywhere}.meta{font-size:13px;color:#778098}.download,button{border:0;cursor:pointer;text-decoration:none;font:600 14px system-ui;background:#6054e8;color:white;padding:11px 16px;border-radius:9px}.download:hover,button:hover{background:#493ec4}.download:focus-visible,button:focus-visible{outline:3px solid #b6acff;outline-offset:3px}#status{font-size:14px;margin:20px 0}#status:empty{display:none}footer{font-size:13px;color:#778098;display:flex;justify-content:space-between;gap:15px}footer a{color:#667089}#count{color:#7b849a;font-size:14px;font-weight:400;margin-left:8px}@media(max-width:560px){header,main,footer{padding:20px}.panel{padding:20px}.hero{padding-top:25px!important}.toolbar,input{width:100%}.file{flex-wrap:wrap}.download{margin-left:64px}footer{flex-direction:column}.badge{display:none}}
</style></head>
<body><header><div class="brand">☁ Alex <span>Cloud</span></div><span class="badge">Espace de partage</span></header><main><section class="hero"><div class="eyebrow">Les fichiers d’Alex</div><h1>Un fichier à portée<br>de clic.</h1><p>Retrouve les fichiers partagés par Alex et télécharge ceux dont tu as besoin.</p></section><section class="panel" aria-labelledby="files-title"><div class="toolbar"><h2 id="files-title">Fichiers disponibles <span id="count"></span></h2><input id="search" type="search" aria-label="Rechercher un fichier" placeholder="Rechercher un fichier…"></div><p id="status" role="status" aria-live="polite">Chargement des fichiers…</p><div id="files"></div><button id="retry" hidden>Réessayer</button></section></main><footer><span>Alex Cloud · Le partage, simplement.</span><a href="https://github.com/titanxxx505/cloud/tree/main/fichiers">Voir les fichiers sur GitHub ↗</a></footer>
<script>
const list=document.getElementById('files'),status=document.getElementById('status'),search=document.getElementById('search'),count=document.getElementById('count'),retry=document.getElementById('retry');let files=[];
function size(n){if(n<1024)return n+' o';if(n<1048576)return (n/1024).toLocaleString('fr-FR',{maximumFractionDigits:1})+' Ko';return (n/1048576).toLocaleString('fr-FR',{maximumFractionDigits:1})+' Mo'}
function render(){list.replaceChildren();const visible=files.filter(f=>f.name.toLocaleLowerCase('fr').includes(search.value.toLocaleLowerCase('fr')));count.textContent='('+files.length+')';status.textContent=files.length?(visible.length?'':'Aucun fichier ne correspond à ta recherche.'):'Aucun fichier partagé pour le moment.';for(const f of visible){const row=document.createElement('div');row.className='file';const icon=document.createElement('div');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent=f.name.includes('.')?f.name.split('.').pop().slice(0,5).toUpperCase():'FICHIER';const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=f.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=size(f.size);info.append(name,meta);const a=document.createElement('a');a.className='download';a.textContent='Télécharger ↓';a.setAttribute('aria-label','Télécharger '+f.name);a.href='./'+f.path.split('/').map(encodeURIComponent).join('/');a.download=f.name;row.append(icon,info,a);list.append(row)}}
async function load(){retry.hidden=true;search.disabled=true;status.textContent='Chargement des fichiers…';try{const r=await fetch('https://api.github.com/repos/titanxxx505/cloud/contents/fichiers?ref=main',{cache:'no-store'});if(r.status===404){files=[];render();return}if(!r.ok)throw new Error('Chargement impossible');const data=await r.json();if(!Array.isArray(data))throw new Error('Réponse invalide');files=data.filter(f=>f.type==='file'&&!f.name.startsWith('.')).sort((a,b)=>a.name.localeCompare(b.name,'fr'));render()}catch(e){list.replaceChildren();count.textContent='';status.textContent='Impossible de charger la liste. Réessaie dans quelques instants ou consulte le lien GitHub en bas de page.';retry.hidden=false}finally{search.disabled=false}}
search.addEventListener('input',render);retry.addEventListener('click',load);load();
</script></body></html>
