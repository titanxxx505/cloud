<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Alex Cloud : les fichiers partagés par Alex, à télécharger simplement."><title>Alex Cloud</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#17213c;font:16px/1.6 system-ui,sans-serif}header,main,footer{max-width:1080px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{color:#6054e8}.badge{font-size:12px;background:#e8e5ff;color:#5046b7;padding:5px 12px;border-radius:30px}section.hero{padding:55px 0 40px;max-width:720px}.eyebrow{color:#6054e8;text-transform:uppercase;font-size:12px;letter-spacing:2px;font-weight:750}h1{font-size:clamp(38px,6vw,64px);line-height:1.12;letter-spacing:-2px;margin:18px 0}p{color:#667089}.hero p{font-size:18px;max-width:550px}.panel{background:white;border:1px solid #e1e5f1;border-radius:22px;padding:28px;box-shadow:0 12px 45px #20305a06}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h2{font-size:21px;margin:0}input{font:inherit;border:1px solid #d5dbea;background:#f8f9fc;border-radius:10px;padding:11px 14px;width:280px;max-width:100%}input:focus{outline:2px solid #6054e8;outline-offset:2px}.file{display:flex;align-items:center;gap:16px;padding:22px 0;border-top:1px solid #edf0f6}.icon{width:48px;height:48px;flex-shrink:0;display:grid;place-items:center;background:#efedff;border-radius:12px;font-size:11px;font-weight:800;color:#6054e8}.info{min-width:0;flex:1}.name{font-weight:650;overflow-wrap:anywhere}.meta{font-size:13px;color:#778098}.download,button{border:0;cursor:pointer;text-decoration:none;font:600 14px system-ui;background:#6054e8;color:white;padding:11px 16px;border-radius:9px}.download:hover,button:hover{background:#493ec4}.download:focus-visible,button:focus-visible{outline:3px solid #b6acff;outline-offset:3px}#status{font-size:14px;margin:20px 0}#status:empty{display:none}footer{font-size:13px;color:#778098;display:flex;justify-content:space-between;gap:15px}footer a{color:#667089}#count{color:#7b849a;font-size:14px;font-weight:400;margin-left:8px}@media(max-width:560px){header,main,footer{padding:20px}.panel{padding:20px}.hero{padding-top:25px!important}.toolbar,input{width:100%}.file{flex-wrap:wrap}.download{margin-left:64px}footer{flex-direction:column}.badge{display:none}}[hidden]{display:none!important}.file-link{color:#17213c;text-decoration:none;display:block}.file-link:hover,.details-link:hover{text-decoration:underline}.details-link{display:inline-block;font-size:13px;color:#6054e8;text-decoration:none;margin-top:5px}.detail-panel{margin-top:30px}.back-link{display:inline-block;color:#6054e8;text-decoration:none;margin-bottom:26px}.detail-title{font-size:clamp(28px,5vw,44px);letter-spacing:-1px;overflow-wrap:anywhere;margin:12px 0}.detail-panel h2{margin-top:28px}.description{white-space:pre-wrap;overflow-wrap:anywhere;color:#44516a}.detail-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;align-items:center}.detail-actions .download{margin:0}.secondary{background:#efedff;color:#5046b7}.secondary:hover{background:#ded9ff}.owner-note{border-top:1px solid #edf0f6;margin-top:32px;padding-top:15px;font-size:13px}.owner-note p{margin:0 0 7px}.edit-description{color:#6054e8}
</style></head><body><header><div class="brand">☁ Alex <span>Cloud</span></div><span class="badge">Espace de partage</span></header><main><section class="hero"><div class="eyebrow">Les fichiers d’Alex</div><h1>Un fichier à portée<br>de clic.</h1><p>Retrouve les fichiers partagés par Alex et télécharge ceux dont tu as besoin.</p></section><section class="panel" aria-labelledby="files-title"><div class="toolbar"><h2 id="files-title">Fichiers disponibles <span id="count"></span></h2><input id="search" type="search" aria-label="Rechercher un fichier" placeholder="Rechercher un fichier…"></div><p id="status" role="status" aria-live="polite">Chargement des fichiers…</p><div id="files"></div><button id="retry" hidden>Réessayer</button></section><section id="detail" class="panel detail-panel" hidden aria-label="Page du fichier"></section></main><footer><span>Alex Cloud · Le partage, simplement.</span><a href="https://github.com/titanxxx505/cloud/tree/main/fichiers">Voir les fichiers sur GitHub ↗</a></footer><script>

const list=document.getElementById('files'),status=document.getElementById('status'),search=document.getElementById('search'),count=document.getElementById('count'),retry=document.getElementById('retry');
const hero=document.querySelector('.hero'),catalog=document.querySelector('.panel'),detail=document.getElementById('detail');
let files=[],descriptions=new Set(),ready=false,view=0;
function size(n){if(n<1024)return n+' o';if(n<1048576)return(n/1024).toLocaleString('fr-FR',{maximumFractionDigits:1})+' Ko';return(n/1048576).toLocaleString('fr-FR',{maximumFractionDigits:1})+' Mo'}
function fileType(name){const dot=name.lastIndexOf('.');return dot>0&&dot<name.length-1?name.slice(dot+1).toUpperCase():'Sans extension'}
function filePath(name){return './fichiers/'+encodeURIComponent(name)}
function pageLink(name){return '#fichier='+encodeURIComponent(name)}
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function downloadLink(f){const a=node('a','Télécharger ↓','download');a.href=filePath(f.name);a.download=f.name;a.setAttribute('aria-label','Télécharger '+f.name);return a}
function defaultDescription(f){return 'Télécharge le fichier « '+f.name+' » partagé sur Alex Cloud. Type : '+fileType(f.name)+'. Taille : '+size(f.size)+'.'}
function render(){list.replaceChildren();const query=search.value.toLocaleLowerCase('fr');const visible=files.filter(f=>f.name.toLocaleLowerCase('fr').includes(query));count.textContent='('+files.length+')';status.textContent=files.length?(visible.length?'':'Aucun fichier ne correspond à ta recherche.'):'Aucun fichier partagé pour le moment.';for(const f of visible){const row=node('div',undefined,'file'),icon=node('div',fileType(f.name).slice(0,5),'icon');icon.setAttribute('aria-hidden','true');const info=node('div',undefined,'info'),name=node('a',f.name,'name file-link');name.href=pageLink(f.name);const meta=node('div',size(f.size)+' · '+fileType(f.name),'meta'),more=node('a','Voir la description →','details-link');more.href=pageLink(f.name);more.setAttribute('aria-label','Voir la description de '+f.name);info.append(name,meta,more);row.append(icon,info,downloadLink(f));list.append(row)}}
async function route(){const ticket=++view;let requested=null;if(location.hash.startsWith('#fichier=')){try{requested=decodeURIComponent(location.hash.slice(9))}catch{requested=''}}if(requested===null){detail.hidden=true;hero.hidden=false;catalog.hidden=false;document.title='Alex Cloud';return}hero.hidden=true;catalog.hidden=true;detail.hidden=false;detail.replaceChildren();const back=node('a','← Tous les fichiers','back-link');back.href='#';detail.append(back);const f=files.find(item=>item.name===requested);if(!f){detail.append(node('h1',ready?'Fichier introuvable':'Chargement…','detail-title'),node('p',ready?'Ce fichier a peut-être été renommé ou retiré. Reviens à la liste pour voir les fichiers disponibles.':'La liste des fichiers est en cours de chargement.'));document.title='Alex Cloud';return}document.title=f.name+' · Alex Cloud';const type=node('div',fileType(f.name),'eyebrow'),title=node('h1',f.name,'detail-title'),meta=node('p',size(f.size)+' · Fichier partagé par Alex','meta'),descTitle=node('h2','Description'),description=node('p',defaultDescription(f),'description');description.setAttribute('aria-live','polite');const actions=node('div',undefined,'detail-actions'),share=node('button','Copier le lien','secondary'),feedback=node('p','','meta');feedback.setAttribute('role','status');share.type='button';share.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);feedback.textContent='Lien copié !'}catch{feedback.textContent='Pour partager cette page, copie son adresse dans la barre du navigateur.'}});actions.append(downloadLink(f),share);const sidecar=f.name+'.description.txt',hasDescription=descriptions.has(sidecar),editor=node('a',hasDescription?'Modifier la description sur GitHub':'Ajouter une description sur GitHub','edit-description');if(hasDescription){editor.href='https://github.com/titanxxx505/cloud/edit/main/fichiers/'+encodeURIComponent(sidecar)}else{const params=new URLSearchParams({filename:'fichiers/'+sidecar,value:'Écris ici la description de '+f.name+'.'});editor.href='https://github.com/titanxxx505/cloud/new/main?'+params}const owner=node('div',undefined,'owner-note');owner.append(node('p','Pour Alex : ajoute ou modifie ton texte, puis valide avec « Commit changes ».'),editor);detail.append(type,title,meta,descTitle,description,actions,feedback,owner);if(hasDescription){description.textContent='Chargement de la description…';try{const r=await fetch(filePath(sidecar),{cache:'no-store'});if(!r.ok)throw new Error('Description indisponible');const text=(await r.text()).trim();if(view===ticket)description.textContent=text||defaultDescription(f)}catch{if(view===ticket)description.textContent=defaultDescription(f)+' La description personnalisée est temporairement indisponible.'}}}
async function load(){retry.hidden=true;search.disabled=true;ready=false;status.textContent='Chargement des fichiers…';try{const r=await fetch('https://api.github.com/repos/titanxxx505/cloud/contents/fichiers?ref=main',{cache:'no-store'});if(r.status===404){files=[];descriptions=new Set()}else{if(!r.ok)throw new Error('Chargement impossible');const data=await r.json();if(!Array.isArray(data))throw new Error('Réponse invalide');const entries=data.filter(f=>f.type==='file'&&!f.name.startsWith('.'));descriptions=new Set(entries.filter(f=>f.name.endsWith('.description.txt')).map(f=>f.name));files=entries.filter(f=>!f.name.endsWith('.description.txt')).sort((a,b)=>a.name.localeCompare(b.name,'fr'))}ready=true;render();await route()}catch{view++;hero.hidden=false;catalog.hidden=false;detail.hidden=true;list.replaceChildren();count.textContent='';status.textContent='Impossible de charger les fichiers. Réessaie dans quelques instants ou consulte le lien GitHub en bas de page.';retry.hidden=false}finally{search.disabled=!ready}}
search.addEventListener('input',render);retry.addEventListener('click',load);window.addEventListener('hashchange',route);load();

</script></body></html>
